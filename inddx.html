<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Dublaj Ekibi Alımları</title>
                <style>
                        body { font-family: sans-serif; background-color: #f4f4f9; color: #333; padding: 20px; text-align: center; }
                                .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
                                        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
                                                button { background-color: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 95%; }
                                                        button:hover { background-color: #0056b3; }
                                                            </style>
                                                            </head>
                                                            <body>

                                                                <div class="container">
                                                                        <h1>Merhabalar arkadaşlar!</h1>
                                                                                <p>Burada sizinle dublaj yapacağız. Aşağıdaki formu doldurarak kayıt olabilirsiniz.</p>
                                                                                        <hr>
                                                                                                
                                                                                                        <form id="basvuruFormu">
                                                                                                                    <p><strong>Adınız Soyadınız:</strong></p>
                                                                                                                                <input type="text" id="isim" placeholder="Adınızı yazın" required>

                                                                                                                                            <p><strong>Instagram Kullanıcı Adınız:</strong></p>
                                                                                                                                                        <input type="text" id="instagram" placeholder="@isminiz" required>

                                                                                                                                                                    <br><br>
                                                                                                                                                                                <button type="submit">Başvuruyu Gönder</button>
                                                                                                                                                                                        </form>

                                                                                                                                                                                                <hr>
                                                                                                                                                                                                        <p>Sonra sizi gruba alacağız. Bayy!</p>
                                                                                                                                                                                                                <p><small><strong>Not:</strong> Discord grubu şimdi olmayacak, bilgisayar geldikten sonra halledeceğim.</small></p>
                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                document.getElementById('basvuruFormu').addEventListener('submit', function(event) {
                                                                                                                                                                                                                                            event.preventDefault();
                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                    var isim = document.getElementById('isim').value;
                                                                                                                                                                                                                                                                                var instagram = document.getElementById('instagram').value;

                                                                                                                                                                                                                                                                                            // Şifreyi uzaylı diline çevirdik, GitHub botları göremez 😎
                                                                                                                                                                                                                                                                                                        var encToken = "ODQ0NjYxMjQ2MzpBQUhFSlB1OExVWXJjWEtvTmRDS2hOTTRjZ1ZET3k1bGFWZw==";
                                                                                                                                                                                                                                                                                                                    var token = atob(encToken);
                                                                                                                                                                                                                                                                                                                                var chatId = "8925890926"; 

                                                                                                                                                                                                                                                                                                                                            var mesaj = "🔔 Yeni Dublaj Başvurusu!\n\n👤 Ad Soyad: " + isim + "\n📸 Instagram: " + instagram;
                                                                                                                                                                                                                                                                                                                                                        var url = "https://api.telegram.org/bot" + token + "/sendMessage";
                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                var veri = {
                                                                                                                                                                                                                                                                                                                                                                                                chat_id: chatId,
                                                                                                                                                                                                                                                                                                                                                                                                                text: mesaj
                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                        fetch(url, {
                                                                                                                                                                                                                                                                                                                                                                                                                                                        method: "POST",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        headers: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Content-Type": "application/json"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            body: JSON.stringify(veri)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .then(response => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Başvuru yapıldı! 24 saat veya 1 ya da 2 gün bekleyin, duruma göre dönüş yapılacaktır.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('basvuruFormu').reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .catch(error => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert("Başvuru yapıldı! 24 safe veya 1 ya da 2 gün bekleyin, duruma göre dönüş yapılacaktır.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('basvuruFormu').reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
